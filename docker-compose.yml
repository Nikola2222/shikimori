name: shikimori

x-env: &env
  environment:
    - SHIKI_DOMAIN=shikimori.local
    - POSTGRES_DEV_HOST=db
    - POSTGRES_DEV_DB=shikimori_development
    - POSTGRES_DEV_USER=shikimori_development
    - POSTGRES_DEV_PASSWORD=password
    # - POSTGRES_INITDB_ARGS=--locale=en_US.UTF-8
    # - LANG=en_US.UTF-8
    # - LC_ALL=en_US.UTF-8
    - POSTGRES_TEST_HOST=db
    - POSTGRES_TEST_DB=shikimori_test
    - POSTGRES_TEST_USER=shikimori_test
    - POSTGRES_TEST_PASSWORD=password
    # - IS_LOCAL_RUN=true
    - POSTGRES_USER=shikimori_development
    - POSTGRES_PASSWORD=password
    # - POSTGRES_DB=shikimori_development
    - PGUSER=postgres
    - PGPASSWORD=password
    - ELASTICSEARCH_URL=http://elasticsearch:9200
    - REDIS_HOST=redis
    - TURNSTILE_SITE_KEY=0x4AAAAAAAEjK3AyokpktOUL
    - TURNSTILE_SECRET_KEY=0x4AAAAAAAEjK8iNEcUwnCrHHS9fNTxZ57w
    - MEMCACHED_HOST=memcached
    - PROXY_URL=socks5://72.195.34.59:4145

services:
  db:
    build:
      context: .
      dockerfile_inline: |
        FROM postgres:13
        RUN localedef -i ru_RU -c -f UTF-8 -A /usr/share/locale/locale.alias ru_RU.UTF-8
        ENV LANG=ru_RU.utf8
    # image: postgres:13
    <<: *env
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    expose:
      - "5432"

  redis:
    image: redis:alpine
    expose:
      - "6379"
    volumes:
      - redis_data:/data

  memcached:
    image: memcached:alpine
    expose:
      - "11211"

  elasticsearch:
    image: elasticsearch:6.8.23
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    expose:
      - "9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  sidekiq:
    # build: .
    image: shikimori-web:latest
    command: bundle exec sidekiq -C config/sidekiq.yml
    volumes:
      - static_data:/shikimori/public
    depends_on:
      - db
      - redis
      - memcached
    <<: *env

  faye:
    build:
      context: https://github.com/shikimori/faye-server.git
      dockerfile_inline: |
        FROM node:22-alpine
        WORKDIR /faye
        COPY package.json .
        RUN yarn install
        COPY . .
    command: node server.js
    environment:
      - FAYE_KEY=xxxxxxxxxxxxxxxxxxxx
      - FAYE_ENDPOINT_PATH=/faye/
      - FAYE_PORT=9292
    expose:
      - "9292"
    depends_on:
      - db
      - redis

  camo:
    build:
      context: https://github.com/shikimori/camo-server.git
      dockerfile_inline: |
        FROM node:22-alpine
        WORKDIR /camo-server
        COPY . .
        RUN yarn
    command: ./node_modules/.bin/coffee server.coffee
    environment:
      - CAMO_KEY=abc
      - PORT=5566
      - CAMO_ENDPOINT_PATH=/camo/
      - CAMO_SOCKET_TIMEOUT=90
      - CAMO_LENGTH_LIMIT=20971520
      - CAMO_LENGTH_LIMIT_REDIRECT=1
      - CAMO_403_REDIRECT=1
      - CAMO_LOGGING_ENABLED=debug
      # - CAMO_ALLOWED_HOSTS=
    expose:
      - "5566"

  # neko-achievements:
  #   build:
  #     context: https://github.com/shikimori/neko-achievements.git
  #     dockerfile_inline: |
  #       FROM elixir:1.14.5-otp-25-alpine
  #       RUN apk add git make gcc erlang-dev
  #       WORKDIR /app
  #       COPY . .
  #       RUN mix local.hex --force && mix deps.get && mix local.rebar --force
  #   environment:
  #     - SHIKIMORI_LOCAL=true
  #   command: mix run --no-halt
  #   ports:
  #     - "4000:4000"

  clockwork:
    image: shikimori-web:latest
    command: bundle exec clockwork config/clock.rb
    <<: *env
    depends_on:
      - sidekiq

  web:
    # image: shikimori-web:latest
    build: .
    <<: *env
    command: ./bin/rails server
    volumes:
      - static_data:/shikimori/public/
      # - ./config/:/shikimori/config/
      # - ./app/:/shikimori/app/
      # - ./lib/:/shikimori/lib/
    expose:
      - "3000"
    depends_on:
      - db
      - redis
      - elasticsearch

  nginx:
    image: nginx:latest
    volumes:
      - static_data:/var/www/
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./certificates/:/etc/certificates/
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
      - faye
      - camo

volumes:
  postgres_data:
  redis_data:
  es_data:
  static_data:
